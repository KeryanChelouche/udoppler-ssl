[project]
name = "udoppler-ssl"
version = "0.1.0"
description = "Parameter-efficient fine-tuning of image foundation models for micro-Doppler radar HAR"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "Keryan Chelouche", email = "keryan.chelouche@gmail.com" },
]
# Versions pinned to the known-working environment (Python 3.14).
# torch / torchvision are pinned to their PUBLIC version only: install the
# CUDA build first from the matching PyTorch index (see README), e.g.
#   pip install torch==2.10.0 torchvision==0.25.0 \
#       --index-url https://download.pytorch.org/whl/cu130
# A local build tag such as "2.10.0+cu130" satisfies "torch==2.10.0", so a
# subsequent `pip install -e .` will not pull a different build.
dependencies = [
    "torch==2.10.0",
    "torchvision==0.25.0",
    "timm==1.0.25",
    "transformers==5.3.0",
    "peft==0.19.1",
    "scikit-learn==1.8.0",
    "scipy==1.17.1",
    "numpy==2.4.2",
    "pandas==3.0.1",
    "matplotlib==3.10.8",
    "seaborn==0.13.2",
    "tqdm==4.67.3",
    "loguru==0.7.3",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
# Everything needed to run paper_tables.ipynb (renders the 3 tables + figure).
notebook = [
    "jupyterlab",
    "nbconvert==7.17.1",
    "ipykernel==7.2.0",
    "tabulate==0.10.0",
]

[project.urls]
Repository = "https://github.com/KeryanChelouche/udoppler-ssl"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["eval*"]
